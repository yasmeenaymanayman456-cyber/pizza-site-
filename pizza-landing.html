<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اسم البيتزيريا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f1;--ink:#1c1a17;--muted:#5d5851;--red:#c8321f;--green:#1e3a2b;--line:#dcd8cf;--card:#fff;--on-green:#f6f5f1}
@media (prefers-color-scheme:dark){:root{--bg:#161512;--ink:#f1eee7;--muted:#b3ada1;--red:#ef6a55;--green:#0f1f17;--line:#34312b;--card:#201e1a;--on-green:#f1eee7}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,Tahoma,Arial,sans-serif;font-size:18px;line-height:1.7}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header{background:var(--green);color:var(--on-green);padding:64px 0 56px;border-bottom:8px solid var(--red)}
h1{font-family:Lalezar,Tajawal,sans-serif;font-weight:400;font-size:clamp(44px,12vw,84px);line-height:1.1}
header p{font-size:1.2rem;margin-top:14px;max-width:32ch}
section{padding:48px 0 8px}
h2{font-family:Lalezar,Tajawal,sans-serif;font-weight:400;font-size:2rem;color:var(--red);margin-bottom:16px}
.menu{list-style:none;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px}
.menu li{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:16px 18px;border-bottom:1px dashed var(--line)}
.menu li:last-child{border-bottom:0}
.menu .n{font-weight:700}
.menu .d{display:block;color:var(--muted);font-size:.9rem;font-weight:400}
.menu .p{font-weight:700;white-space:nowrap}
.info{display:grid;gap:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.box h3{font-size:1.05rem;margin-bottom:6px}
.ph{outline:2px dashed var(--red);outline-offset:2px;border-radius:4px}
footer{padding:40px 0 56px;color:var(--muted);font-size:.9rem}
@media (min-width:640px){.info{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 class="ph">[اسم البيتزيريا]</h1>
    <p class="ph">[جملة التعريف]</p>
  </div>
</header>

<main class="wrap">
  <section id="menu">
    <h2>المنيو</h2>
    <ul class="menu">
      <li><span><span class="n ph">[اسم الصنف 1]</span></span><span class="p ph">[السعر]</span></li>
      <li><span><span class="n ph">[اسم الصنف 2]</span></span><span class="p ph">[السعر]</span></li>
      <li><span><span class="n ph">[اسم الصنف 3]</span></span><span class="p ph">[السعر]</span></li>
    </ul>
  </section>

  <section id="visit">
    <h2>مواعيدنا وعنواننا</h2>
    <div class="info">
      <div class="box"><h3>المواعيد</h3><p class="ph">[الأيام والساعات]</p></div>
      <div class="box"><h3>العنوان</h3><p class="ph">[العنوان]</p></div>
    </div>
  </section>
</main>

<footer><div class="wrap">© <span class="ph">[اسم البيتزيريا]</span></div></footer>
</body>
</html>
